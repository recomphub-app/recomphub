<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Flag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="backdrop" class="backdrop" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">Black <span>Flag</span></div>
    <button id="btn-profile" class="ghost profile-chip" title="Trocar de perfil"></button>
    <div class="actions">
      <button id="btn-tv" class="ghost" title="Biblioteca em tela cheia, com controle ou teclado">Modo TV</button>
      <div class="menu">
        <button class="ghost" data-menu aria-haspopup="true">Mais ▾</button>
        <div class="menu-list" hidden>
          <button id="btn-stats">Estatísticas</button>
          <button id="btn-covers">Capas</button>
          <button id="btn-backup">Backup dos saves</button>
          <button id="btn-updates">Verificar atualizações</button>
          <button id="btn-tour">Tutorial</button>
        </div>
      </div>
      <div class="menu">
        <button class="primary" data-menu aria-haspopup="true">Adicionar ▾</button>
        <div class="menu-list" hidden>
          <button id="btn-discover">Instalar um port</button>
          <button id="btn-add">Port que já está no PC</button>
          <button id="btn-stores">Jogos da Steam, Epic e GOG</button>
          <button id="btn-add-pc">Jogo de PC</button>
        </div>
      </div>
      <button id="btn-settings" class="ghost" title="Configurações">⚙</button>
    </div>
  </header>
  <div id="app-update" class="app-update" hidden></div>
  <div id="tv" class="tv" hidden></div>
  <div id="who" class="who" hidden></div>

  <main>
    <section id="library">
      <div id="lib-hero"></div>
      <button id="lib-back" class="ghost back" hidden>← Biblioteca</button>
      <h1 id="lib-title">Biblioteca</h1>
      <div class="tabs" id="tabs">
        <button data-tab="all">Todos</button>
        <button data-tab="port">Ports</button>
        <button data-tab="steam">Steam</button>
        <button data-tab="epic">Epic</button>
        <button data-tab="gog">GOG</button>
        <button data-tab="pc_game">Jogos de PC</button>
        <span class="tab-sep" aria-hidden="true"></span>
        <button data-tab="community">Comunidade</button>
      </div>
      <div id="community-head" class="community-head" hidden></div>
      <div class="toolbar">
        <input type="search" id="search" placeholder="Buscar">
        <div class="filters" id="tagbar"></div>
      </div>
      <p id="cover-status" class="cover-status" hidden></p>
      <div id="grid" class="grid"></div>
      <p id="empty" class="muted" hidden></p>
    </section>

    <section id="detail" hidden></section>
  </main>

  <div id="tour" class="tour" hidden></div>
  <div id="pad-hints" class="pad-hints"></div>
  <div id="resume" class="resume" hidden></div>
  <div id="ask" class="ask" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
