<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Flag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="backdrop" class="backdrop" aria-hidden="true"></div>
  <div id="backdrop2" class="backdrop" aria-hidden="true"></div>
  <header class="topbar">
    <div class="sysbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Black <span>Flag</span></div>
      <div class="actions">
        <div class="menu">
          <button class="primary" data-menu aria-haspopup="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Adicionar</button>
          <div class="menu-list" hidden>
            <button id="btn-emu">Jogos de console (emuladores)</button>
            <button id="btn-discover">Instalar um port</button>
            <button id="btn-add">Port que já está no PC</button>
            <button id="btn-stores">Jogos da Steam, Epic e GOG</button>
            <button id="btn-add-pc">Jogo de PC</button>
          </div>
        </div>
        <button id="btn-tv" class="ghost pill" title="Biblioteca em tela cheia, com controle ou teclado"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8.5 20.5h7"/></svg>Modo TV</button>
        <div class="menu">
          <button class="ghost pill" data-menu aria-haspopup="true">Mais<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></svg></button>
          <div class="menu-list" hidden>
            <button id="btn-covers">Capas</button>
            <button id="btn-backup">Backup dos saves</button>
            <button id="btn-updates">Verificar atualizações</button>
            <button id="btn-setup">Capas e conquistas</button>
            <button id="btn-tour">Tutorial</button>
          </div>
        </div>
        <button id="btn-settings" class="ghost pill icon" title="Configurações" aria-label="Configurações"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <span id="clock" class="clock" aria-hidden="true"></span>
        <button id="btn-profile" class="profile-chip" title="Trocar de perfil"></button>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Seções">
      <span class="nav-key" data-pad="lb" aria-hidden="true"></span>
      <button data-nav="library"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>Biblioteca</button>
      <button data-nav="emu"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 7.5h9.6a4 4 0 0 1 3.9 3.2l.9 4.4a2.3 2.3 0 0 1-4 1.9l-2-2.3H8.4l-2 2.3a2.3 2.3 0 0 1-4-1.9l.9-4.4a4 4 0 0 1 3.9-3.2z"/><path d="M8.5 10v3M7 11.5h3"/><path d="M15.5 11h.01M17.5 12.5h.01"/></svg>Emuladores</button>
      <button data-nav="discover"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M4.5 16.5v1.8A1.7 1.7 0 0 0 6.2 20h11.6a1.7 1.7 0 0 0 1.7-1.7v-1.8"/></svg>Instalar ports</button>
      <button data-nav="community"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19.5a5.5 5.5 0 0 1 11 0"/><circle cx="16.5" cy="9.5" r="2.4"/><path d="M15.8 14.3a4.6 4.6 0 0 1 4.7 4.7"/></svg>Comunidade</button>
      <button data-nav="stats"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-6M11 20V5M17 20v-9M3 20h18"/></svg>Estatísticas</button>
      <span class="nav-key" data-pad="rb" aria-hidden="true"></span>
    </nav>
  </header>
  <div id="app-update" class="app-update" hidden></div>
  <div id="tv" class="tv" hidden></div>
  <div id="who" class="who" hidden></div>

  <main>
    <section id="library">
      <div id="lib-hero"></div>
      <div id="setup-hint" class="setup-hint" hidden></div>
      <button id="lib-back" class="ghost back" hidden>← Biblioteca</button>
      <h1 id="lib-title">Biblioteca</h1>
      <div class="tabs" id="tabs">
        <button data-tab="all">Todos</button>
        <button data-tab="port">Ports</button>
        <button data-tab="emu">Emulados</button>
        <button data-tab="steam">Steam</button>
        <button data-tab="epic">Epic</button>
        <button data-tab="gog">GOG</button>
        <button data-tab="pc_game">Jogos de PC</button>
      </div>
      <div id="community-head" class="community-head" hidden></div>
      <div class="toolbar">
        <input type="search" id="search" placeholder="Buscar">
        <div class="filters" id="tagbar"></div>
      </div>
      <p id="cover-status" class="cover-status" hidden></p>
      <div id="grid" class="grid"></div>
      <p id="empty" class="muted" hidden></p>
    </section>

    <section id="detail" hidden></section>
  </main>

  <div id="tour" class="tour" hidden></div>
  <div id="setup" class="tour" hidden></div>
  <div id="pad-hints" class="pad-hints"></div>
  <div id="resume" class="resume" hidden></div>
  <div id="ask" class="ask" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
