<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Flag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="backdrop" class="backdrop" aria-hidden="true"></div>
  <header class="topbar">
    <div class="sysbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Black <span>Flag</span></div>
      <div class="actions">
        <div class="menu">
          <button class="primary" data-menu aria-haspopup="true">+ Adicionar</button>
          <div class="menu-list" hidden>
            <button id="btn-emu">Jogos de console (emuladores)</button>
            <button id="btn-discover">Instalar um port</button>
            <button id="btn-add">Port que já está no PC</button>
            <button id="btn-stores">Jogos da Steam, Epic e GOG</button>
            <button id="btn-add-pc">Jogo de PC</button>
          </div>
        </div>
        <button id="btn-tv" class="ghost pill" title="Biblioteca em tela cheia, com controle ou teclado">▶ Modo TV</button>
        <div class="menu">
          <button class="ghost pill" data-menu aria-haspopup="true">Mais ▾</button>
          <div class="menu-list" hidden>
            <button id="btn-covers">Capas</button>
            <button id="btn-backup">Backup dos saves</button>
            <button id="btn-updates">Verificar atualizações</button>
            <button id="btn-tour">Tutorial</button>
          </div>
        </div>
        <button id="btn-settings" class="ghost pill icon" title="Configurações">⚙</button>
        <span id="clock" class="clock" aria-hidden="true"></span>
        <button id="btn-profile" class="profile-chip" title="Trocar de perfil"></button>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Seções">
      <span class="nav-key" data-pad="lb" aria-hidden="true"></span>
      <button data-nav="library"><span class="nav-ico" aria-hidden="true">▦</span>Biblioteca</button>
      <button data-nav="emu"><span class="nav-ico" aria-hidden="true">◉</span>Emuladores</button>
      <button data-nav="discover"><span class="nav-ico" aria-hidden="true">⬇</span>Instalar ports</button>
      <button data-nav="community"><span class="nav-ico" aria-hidden="true">✦</span>Comunidade</button>
      <button data-nav="stats"><span class="nav-ico" aria-hidden="true">▤</span>Estatísticas</button>
      <span class="nav-key" data-pad="rb" aria-hidden="true"></span>
    </nav>
  </header>
  <div id="app-update" class="app-update" hidden></div>
  <div id="tv" class="tv" hidden></div>
  <div id="who" class="who" hidden></div>

  <main>
    <section id="library">
      <div id="lib-hero"></div>
      <button id="lib-back" class="ghost back" hidden>← Biblioteca</button>
      <h1 id="lib-title">Biblioteca</h1>
      <div class="tabs" id="tabs">
        <button data-tab="all">Todos</button>
        <button data-tab="port">Ports</button>
        <button data-tab="emu">Emulados</button>
        <button data-tab="steam">Steam</button>
        <button data-tab="epic">Epic</button>
        <button data-tab="gog">GOG</button>
        <button data-tab="pc_game">Jogos de PC</button>
      </div>
      <div id="community-head" class="community-head" hidden></div>
      <div class="toolbar">
        <input type="search" id="search" placeholder="Buscar">
        <div class="filters" id="tagbar"></div>
      </div>
      <p id="cover-status" class="cover-status" hidden></p>
      <div id="grid" class="grid"></div>
      <p id="empty" class="muted" hidden></p>
    </section>

    <section id="detail" hidden></section>
  </main>

  <div id="tour" class="tour" hidden></div>
  <div id="pad-hints" class="pad-hints"></div>
  <div id="resume" class="resume" hidden></div>
  <div id="ask" class="ask" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
