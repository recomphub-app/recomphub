# Publishes site/ on GitHub Pages whenever the site or the catalog changes, and once a day so the
# numbers on the port pages (stars, downloads, versions) stay current.
name: Site

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths: ['site/**', 'src-tauri/catalog.json', 'tools/site-games.mjs', '.github/workflows/site.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The port list on the site comes from the same catalog the program uses.
      - name: Copy the catalog
        run: cp src-tauri/catalog.json site/catalog.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Covers and banners already fetched stay from one day to the next, so each run only looks up
      # the games that are new (tools/site-games.mjs keeps an index of them in img/games).
      - name: Keep the game art
        uses: actions/cache@v4
        with:
          path: site/img/games
          key: game-art-${{ github.run_id }}
          restore-keys: game-art-
      # The showcase (ports.html), every game (todos.html) and a page per game: the verified ports
      # with their facts sheet, and the community ones the program lists. Art from SteamGridDB when
      # the SGDB_KEY secret is set.
      - name: Build the game pages
        run: node tools/site-games.mjs site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SGDB_KEY: ${{ secrets.SGDB_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
